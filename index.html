<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="B-SIDE">
  <title>B-SIDE</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 320px;
      margin: 0;
      overflow: hidden;
      background: #020202;
      color: #f4efe8;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }
    body { position: fixed; inset: 0; }
    #scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100vw;
      height: 100svh;
      background: transparent;
      outline: none;
      touch-action: none;
    }
    #bgNoise {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100svh;
      pointer-events: none;
    }
    #bgImage {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100svh;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.94;
    }
    #vinylStage {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100vw;
      height: 100svh;
      pointer-events: auto;
      display: none;
    }
    #vinylStage.active { display: block; }
    #hud, #detail {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    #hud::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 190px;
      background: linear-gradient(180deg, rgba(2,2,2,.95), rgba(2,2,2,.58), transparent);
    }
    .brand {
      position: absolute;
      top: 48px;
      left: 22px;
      z-index: 1;
      width: min(260px, calc(100vw - 138px));
      transition: opacity .28s ease, transform .28s ease;
    }
    .brand small {
      display: block;
      color: rgba(244,239,232,.58);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
    }
    .brand h1 {
      margin: 6px 0 8px;
      color: #f3ece1;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(36px, 10.5vw, 54px);
      line-height: .9;
      letter-spacing: 0;
    }
    .brand p { display: none; }
    .fm-btn {
      position: absolute;
      top: 48px;
      right: 22px;
      z-index: 2;
      pointer-events: auto;
      width: 58px;
      height: 58px;
      border: 1px solid rgba(244,239,232,.2);
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      color: #fff7ea;
      background: rgba(10,9,8,.58);
      box-shadow: 0 16px 42px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
      transition: opacity .28s ease, transform .28s ease, border-color .2s ease;
    }
    .fm-btn:active {
      transform: scale(.94);
      border-color: rgba(244,239,232,.42);
    }
    .fm-logo {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 5px 12px rgba(0,0,0,.38));
    }
    .fm-label {
      position: absolute;
      bottom: 7px;
      left: 0;
      right: 0;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .06em;
      text-align: center;
    }
    body.presenting .fm-btn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-12px);
    }
    .back-btn {
      pointer-events: auto;
      border: 0;
      border-radius: 999px;
      background: rgba(244,239,232,.94);
      color: #15110e;
      font: 800 13px Arial, "PingFang SC", sans-serif;
      min-height: 38px;
      padding: 0 18px;
    }
    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 32px;
      text-align: center;
      text-shadow: 0 2px 18px rgba(0,0,0,.8);
    }
    .caption strong {
      display: block;
      font-size: 24px;
      color: #f6efe4;
    }
    .caption span {
      display: block;
      margin-top: 7px;
      color: rgba(246,239,228,.58);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .caption {
      transition: opacity .36s ease, transform .36s ease;
    }
    body.presenting .caption {
      opacity: 0;
      transform: translateY(18px);
    }
    body.presenting .brand {
      opacity: 0;
      transform: translateY(-12px);
    }
    .album-title-layer {
      position: fixed;
      left: 0;
      right: 0;
      top: 18svh;
      z-index: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(22px) scale(.98);
      transition: opacity .46s ease, transform .46s ease;
      mix-blend-mode: screen;
    }
    body.presenting .album-title-layer {
      opacity: .28;
      transform: translateY(0) scale(1);
    }
    .album-title-layer strong {
      max-width: 92vw;
      color: #fff7e8;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(58px, 21vw, 128px);
      line-height: .82;
      letter-spacing: 0;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 0 40px rgba(255,255,255,.28), 0 18px 58px rgba(0,0,0,.68);
    }
    .photo-drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      height: min(67svh, 620px);
      padding: 28px 18px calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(247,239,225,.96), rgba(218,208,190,.98));
      color: #17120e;
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -24px 80px rgba(0,0,0,.52);
      transform: translateY(105%);
      transition: transform .58s cubic-bezier(.2,.86,.2,1);
      pointer-events: auto;
      overflow: hidden;
    }
    .photo-drawer.open { transform: translateY(0); }
    .drawer-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    .drawer-head strong {
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(32px, 10vw, 52px);
      line-height: .9;
      letter-spacing: 0;
    }
    .drawer-head span {
      flex: 0 0 auto;
      color: rgba(23,18,14,.56);
      font-size: 12px;
      font-weight: 900;
    }
    .drawer-grid {
      display: flex;
      flex-direction: row;
      gap: 12px;
      height: calc(100% - 64px);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 18px 8px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      scroll-padding: 0 calc(50vw - 90px);
    }
    .photo-thumb {
      flex: 0 0 auto;
      position: relative;
      border: 0;
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #1a1714 center / cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(23,18,14,.18);
      height: 100%;
      width: auto;
      scroll-snap-align: center;
    }
    .photo-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 48%, rgba(0,0,0,.58));
    }
    .photo-thumb span {
      position: absolute;
      left: 9px;
      right: 9px;
      bottom: 8px;
      z-index: 1;
      color: #fff7ea;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.25;
      text-align: left;
      text-shadow: 0 1px 8px rgba(0,0,0,.65);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .photo-thumb.active {
      box-shadow: inset 0 0 0 3px #17120e, 0 12px 30px rgba(23,18,14,.22);
    }
    @media (orientation: landscape) {
      .album-title-layer, .photo-drawer { display: none; }
    }
    #detail {
      display: none;
      z-index: 5;
      background: #050505;
      pointer-events: auto;
    }
    #detail.open { display: block; }
    #detailCanvas {
      display: block;
      width: 100vw;
      height: 100svh;
    }
    .back-btn {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      background: rgba(0,0,0,.62);
      color: #fff7ea;
      border: 1px solid rgba(255,255,255,.18);
    }
    .error {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      padding: 28px;
      background: #080706;
      color: #f4efe8;
      text-align: center;
      font-weight: 800;
    }
    .error.show { display: grid; }
    .video-player {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: none;
      background: #000;
      pointer-events: auto;
    }
    .video-player.open { display: flex; align-items: center; justify-content: center; }
    #videoEl {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .video-wrapper {
      position: absolute;
      inset: 0;
      transition: transform .2s ease, opacity .2s ease;
    }
    .video-wrapper.swipe-up {
      transform: translateY(-100%);
      opacity: 0;
    }
    .video-wrapper.swipe-down {
      transform: translateY(100%);
      opacity: 0;
    }
    .video-progress {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 3;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.52);
      color: rgba(255,247,234,.78);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      pointer-events: none;
    }
    .video-meta {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.82));
      color: #fff7ea;
      pointer-events: none;
    }
    .video-meta strong {
      display: block;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .video-meta p {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.35;
    }
    .video-music {
      margin: 4px 0 0 !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      color: rgba(255,247,234,.5) !important;
      -webkit-line-clamp: 1 !important;
    }
    .video-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .video-tags span {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 4px;
      background: rgba(255,255,255,.14);
      color: #eee;
    }
    .video-engagement {
      display: flex;
      gap: 18px;
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,247,234,.72);
    }
    .video-landscape-hint {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      place-items: center;
      background: #020202;
      color: #f4efe8;
      font-size: 16px;
      font-weight: 800;
      pointer-events: none;
    }
    @media (orientation: landscape) {
      .video-player.open #videoEl { display: none; }
      .video-player.open .video-meta { display: none; }
      .video-player.open .video-landscape-hint { display: grid; }
    }
  </style>
</head>
<body>
  <img id="bgImage" src="./images/black-wallpaper.jpeg" alt="" aria-hidden="true">
  <canvas id="bgNoise" aria-hidden="true"></canvas>
  <canvas id="scene" aria-label="3D 音乐视频 CD 架"></canvas>
  <canvas id="vinylStage"></canvas>
  <div id="hud">
    <div class="brand">
      <small>MUSIC VIDEO COMPANION</small>
      <h1>B-SIDE</h1>
      <p></p>
    </div>
    <button id="fmBtn" class="fm-btn" type="button" aria-label="打开 B-SIDE FM" title="B-SIDE FM">
      <img class="fm-logo" src="./images/bside-fm-logo.png" alt="" aria-hidden="true">
      <span class="fm-label">FM</span>
    </button>
    <div class="caption">
      <strong id="captionTitle">暖色</strong>
      <span id="captionMeta">3 张 · 色系</span>
    </div>
  </div>
  <div id="albumTitleLayer" class="album-title-layer" aria-hidden="true"><strong>暖色</strong></div>
  <section id="photoDrawer" class="photo-drawer" aria-label="内容抽屉">
    <div class="drawer-head">
      <strong id="drawerTitle">暖色</strong>
      <span id="drawerMeta">3 张</span>
    </div>
    <div id="drawerGrid" class="drawer-grid"></div>
  </section>
  <section id="detail" aria-label="内容详情">
    <button id="backBtn" class="back-btn" type="button">返回</button>
    <canvas id="detailCanvas"></canvas>
  </section>
  <section id="videoPlayer" class="video-player" aria-label="视频播放器">
    <button id="videoCloseBtn" class="back-btn" type="button" aria-label="关闭视频">&#10005;</button>
    <span id="videoProgress" class="video-progress"></span>
    <div id="videoWrapper" class="video-wrapper">
      <video id="videoEl" playsinline webkit-playsinline x5-video-player-type="h5" x5-video-orientation="portrait" preload="auto"></video>
    </div>
    <div class="video-meta">
      <strong id="videoAuthor"></strong>
      <p id="videoTitle"></p>
      <p class="video-music" id="videoMusic"></p>
      <div class="video-tags" id="videoTags"></div>
      <div class="video-engagement">
        <span id="videoLikes"></span>
        <span id="videoComments"></span>
        <span id="videoFavorites"></span>
        <span id="videoShares"></span>
      </div>
    </div>
    <div class="video-landscape-hint" id="videoLandscapeHint">请竖屏观看</div>
  </section>
  <div id="error" class="error">哎呀，出错了，请重启试试吧~</div>
  <script type="module" src="./js/main.js"></script>
  <script>(function() {
  const canvas = document.getElementById("bgNoise");
  const ctx = canvas.getContext("2d");
  let frame = 0, w = 0, h = 0;
  let startTime = 0;

  function resize() {
    w = Math.max(320, innerWidth);
    h = Math.max(320, innerHeight);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
  }

  function draw() {
    frame++;
    if (frame % 3 === 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const elapsed = startTime ? performance.now() - startTime : 0;
      const waveOffset = Math.sin(elapsed / 6000 * Math.PI * 2) * canvas.height * 0.08;
      const glowCY = canvas.height * 0.24 + waveOffset;

      ctx.save();
      ctx.translate(canvas.width / 2, glowCY);
      ctx.scale(1.9, 0.42);
      const r = canvas.width * 0.46;
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      glow.addColorStop(0, "rgba(42, 37, 32, 0.45)");
      glow.addColorStop(0.32, "rgba(42, 37, 32, 0.14)");
      glow.addColorStop(0.68, "rgba(42, 37, 32, 0.03)");
      glow.addColorStop(1, "rgba(2, 2, 2, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(-canvas.width, -canvas.height * 3, canvas.width * 2, canvas.height * 6);
      ctx.restore();

      const vig = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, canvas.width * 0.28,
        canvas.width / 2, canvas.height / 2, canvas.width * 0.84
      );
      vig.addColorStop(0, "rgba(0, 0, 0, 0)");
      vig.addColorStop(1, "rgba(0, 0, 0, 0.94)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    requestAnimationFrame(draw);
  }

  addEventListener("resize", resize);
  resize();
  startTime = performance.now();
  draw();
})();</script>
</body>
</html>
