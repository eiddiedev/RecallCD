<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="记忆CD">
  <title>记忆CD</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 320px;
      margin: 0;
      overflow: hidden;
      background: #020202;
      color: #f4efe8;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }
    body { position: fixed; inset: 0; }
    #scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100vw;
      height: 100svh;
      background: transparent;
      outline: none;
      touch-action: none;
    }
    #hud, #detail {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    #hud::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 190px;
      background: linear-gradient(180deg, rgba(2,2,2,.95), rgba(2,2,2,.58), transparent);
    }
    .brand {
      position: absolute;
      top: 24px;
      left: 22px;
      z-index: 1;
      width: min(260px, calc(100vw - 138px));
    }
    .brand small {
      display: block;
      color: rgba(244,239,232,.58);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
    }
    .brand h1 {
      margin: 6px 0 8px;
      color: #f3ece1;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(36px, 10.5vw, 54px);
      line-height: .9;
      letter-spacing: 0;
    }
    .brand p { display: none; }
    .import-btn, .delete-cd-btn, .back-btn {
      pointer-events: auto;
      border: 0;
      border-radius: 999px;
      background: rgba(244,239,232,.94);
      color: #15110e;
      font: 800 13px Arial, "PingFang SC", sans-serif;
      min-height: 38px;
      padding: 0 18px;
    }
    .import-btn {
      position: absolute;
      top: 24px;
      right: 22px;
      z-index: 2;
    }
    body.presenting .import-btn { right: 70px; }
    .delete-cd-btn {
      position: absolute;
      top: 24px;
      right: 22px;
      z-index: 2;
      width: 38px;
      height: 38px;
      min-height: unset;
      padding: 0;
      color: rgba(244,239,232,.82);
      background: rgba(18,14,11,.5);
      border: 1px solid rgba(244,239,232,.2);
      backdrop-filter: blur(10px);
      font-size: 22px;
      line-height: 1;
      display: none;
    }
    .delete-cd-btn.show { display: inline-block; }
    body.presenting .delete-cd-btn { display: inline-block; }
    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 32px;
      text-align: center;
      text-shadow: 0 2px 18px rgba(0,0,0,.8);
    }
    .caption strong {
      display: block;
      font-size: 24px;
      color: #f6efe4;
    }
    .caption span {
      display: block;
      margin-top: 7px;
      color: rgba(246,239,228,.58);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .caption {
      transition: opacity .36s ease, transform .36s ease;
    }
    body.presenting .caption {
      opacity: 0;
      transform: translateY(18px);
    }
    .album-title-layer {
      position: fixed;
      left: 0;
      right: 0;
      top: 18svh;
      z-index: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(22px) scale(.98);
      transition: opacity .46s ease, transform .46s ease;
      mix-blend-mode: screen;
    }
    body.presenting .album-title-layer {
      opacity: .28;
      transform: translateY(0) scale(1);
    }
    .album-title-layer strong {
      max-width: 92vw;
      color: #fff7e8;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(58px, 21vw, 128px);
      line-height: .82;
      letter-spacing: 0;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 0 40px rgba(255,255,255,.28), 0 18px 58px rgba(0,0,0,.68);
    }
    .photo-drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      height: min(67svh, 620px);
      padding: 28px 18px calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(247,239,225,.96), rgba(218,208,190,.98));
      color: #17120e;
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -24px 80px rgba(0,0,0,.52);
      transform: translateY(105%);
      transition: transform .58s cubic-bezier(.2,.86,.2,1);
      pointer-events: auto;
      overflow: hidden;
    }
    .photo-drawer.open { transform: translateY(0); }
    .drawer-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    .drawer-head strong {
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(32px, 10vw, 52px);
      line-height: .9;
      letter-spacing: 0;
    }
    .drawer-head span {
      flex: 0 0 auto;
      color: rgba(23,18,14,.56);
      font-size: 12px;
      font-weight: 900;
    }
    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: minmax(126px, 24svh);
      gap: 10px;
      height: calc(100% - 64px);
      overflow: auto;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .photo-thumb {
      position: relative;
      min-width: 0;
      border: 0;
      padding: 0;
      border-radius: 6px;
      overflow: hidden;
      background: #1a1714 center / cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(23,18,14,.18);
    }
    .photo-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 48%, rgba(0,0,0,.58));
    }
    .photo-thumb span {
      position: absolute;
      left: 9px;
      right: 9px;
      bottom: 8px;
      z-index: 1;
      color: #fff7ea;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.25;
      text-align: left;
      text-shadow: 0 1px 8px rgba(0,0,0,.65);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .photo-thumb.active {
      box-shadow: inset 0 0 0 3px #17120e, 0 12px 30px rgba(23,18,14,.22);
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
      place-items: end center;
      padding: 18px;
      background: rgba(0,0,0,.58);
      pointer-events: auto;
    }
    .modal.open { display: grid; }
    .import-panel {
      width: min(100%, 430px);
      padding: 24px;
      color: #18120e;
      background: rgba(247,239,225,.98);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.46);
    }
    .import-panel h2 {
      margin: 0 0 16px;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: 38px;
      line-height: .9;
      letter-spacing: 0;
    }
    .panel-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }
    .panel-actions button {
      border: 0;
      min-height: 42px;
      border-radius: 999px;
      font: 900 13px Arial, "PingFang SC", sans-serif;
    }
    .choose-files {
      color: #fff8ec;
      background: #18120e;
    }
    .cancel-panel {
      color: rgba(24,18,14,.64);
      background: rgba(24,18,14,.08);
      padding: 0 18px;
    }
    .tab-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      display: flex;
      justify-content: center;
      gap: 0;
      padding: 0 16px calc(10px + env(safe-area-inset-bottom)) 16px;
      pointer-events: auto;
    }
    .tab-bar button {
      flex: 1;
      max-width: 160px;
      border: 0;
      padding: 10px 0 8px;
      color: rgba(244,239,232,.45);
      background: transparent;
      font: 800 13px Arial, "PingFang SC", sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-align: center;
      transition: color .32s;
    }
    .tab-bar button.active {
      color: #f4efe8;
    }
    .tab-indicator {
      position: absolute;
      bottom: 2px;
      height: 2.5px;
      border-radius: 2px;
      background: #f4efe8;
      transition: left .32s cubic-bezier(.4,.0,.2,1), width .32s cubic-bezier(.4,.0,.2,1);
      pointer-events: none;
    }
    .assign-location-btn {
      pointer-events: auto;
      border: 0;
      border-radius: 999px;
      background: rgba(244,239,232,.94);
      color: #15110e;
      font: 800 13px Arial, "PingFang SC", sans-serif;
      min-height: 38px;
      padding: 0 18px;
      display: none;
    }
    .assign-location-btn.show { display: inline-block; }
    .photo-thumb.selected::before {
      content: "✓";
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 2;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #18120e;
      color: #fff8ec;
      font-size: 13px;
      font-weight: 900;
      display: grid;
      place-items: center;
    }
    .location-panel {
      width: min(100%, 400px);
      padding: 24px;
      color: #18120e;
      background: rgba(247,239,225,.98);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.46);
    }
    .location-panel h2 {
      margin: 0 0 18px;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: 34px;
      line-height: .9;
      letter-spacing: 0;
    }
    .location-panel input {
      width: 100%;
      border: 2px solid rgba(24,18,14,.15);
      border-radius: 14px;
      padding: 12px 16px;
      font: 600 15px Arial, "PingFang SC", sans-serif;
      color: #18120e;
      background: #fff;
      outline: none;
      margin-bottom: 16px;
    }
    .location-panel input:focus {
      border-color: #18120e;
    }
    .location-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }
    .location-actions button {
      border: 0;
      min-height: 42px;
      border-radius: 999px;
      font: 900 13px Arial, "PingFang SC", sans-serif;
    }
    .save-location-btn {
      color: #fff8ec;
      background: #18120e;
    }
    .cancel-location-btn {
      color: rgba(24,18,14,.64);
      background: rgba(24,18,14,.08);
      padding: 0 18px;
    }
    @media (orientation: landscape) {
      .album-title-layer, .photo-drawer, .tab-bar, .assign-location-btn { display: none; }
    }
    #detail {
      display: none;
      z-index: 5;
      background: #050505;
      pointer-events: auto;
    }
    #detail.open { display: block; }
    #detailCanvas {
      display: block;
      width: 100vw;
      height: 100svh;
    }
    .back-btn {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      background: rgba(0,0,0,.62);
      color: #fff7ea;
      border: 1px solid rgba(255,255,255,.18);
    }
    .hidden-file {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .error {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      padding: 28px;
      background: #080706;
      color: #f4efe8;
      text-align: center;
      font-weight: 800;
    }
    .error.show { display: grid; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="3D 照片 CD 档案架"></canvas>
  <div id="hud">
    <button id="importBtn" class="import-btn" type="button">导入照片</button>
    <button id="deleteCdBtn" class="delete-cd-btn" type="button">&times;</button>
    <div class="brand">
      <small>MEMORY DISC</small>
      <h1>记忆CD</h1>
      <p></p>
    </div>
    <div class="caption">
      <strong id="captionTitle">暖色</strong>
      <span id="captionMeta">3 张 · 色系</span>
    </div>
  </div>
  <div id="albumTitleLayer" class="album-title-layer" aria-hidden="true"><strong>暖色</strong></div>
  <section id="photoDrawer" class="photo-drawer" aria-label="照片集抽屉">
    <div class="drawer-head">
      <strong id="drawerTitle">暖色</strong>
      <span id="drawerMeta">3 张</span>
    </div>
    <div id="drawerGrid" class="drawer-grid"></div>
  </section>
  <nav id="tabBar" class="tab-bar" role="tablist" aria-label="分类切换">
    <button type="button" role="tab" class="active" data-tab="palette">Color</button>
    <button type="button" role="tab" data-tab="location">Place</button>
    <button type="button" role="tab" data-tab="time">Time</button>
    <span id="tabIndicator" class="tab-indicator"></span>
  </nav>
  <button id="assignLocationBtn" class="assign-location-btn" type="button">设置地点</button>
  <section id="locationModal" class="modal" aria-label="设置地点">
    <div class="location-panel">
      <h2>设置地点</h2>
      <input id="locationInput" type="text" placeholder="输入地点名称，如：北京" autocomplete="off">
      <div class="location-actions">
        <button id="saveLocationBtn" class="save-location-btn" type="button">确定</button>
        <button id="cancelLocationBtn" class="cancel-location-btn" type="button">取消</button>
      </div>
    </div>
  </section>
  <section id="detail" aria-label="照片详情">
    <button id="backBtn" class="back-btn" type="button">返回</button>
    <canvas id="detailCanvas"></canvas>
  </section>
  <input id="filePicker" class="hidden-file" type="file" accept="image/*,.heic,.heif,image/heic,image/heif" multiple>
  <div id="error" class="error">哎呀，出错了，请重启试试吧~</div>
  <script type="module" src="./js/main.js?v=py2"></script>
</body>
</html>
