<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="B-SIDE">
  <title>B-SIDE</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 320px;
      margin: 0;
      overflow: hidden;
      background: #020202;
      color: #f4efe8;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }
    body { position: fixed; inset: 0; }
    #scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100vw;
      height: 100svh;
      background: transparent;
      outline: none;
      touch-action: none;
    }
    #bgNoise {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100svh;
      pointer-events: none;
    }
    #bgImage {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100svh;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.94;
    }
    #vinylStage {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100vw;
      height: 100svh;
      pointer-events: auto;
      display: none;
    }
    #vinylStage.active { display: block; }
    .detail-entry-btn {
      position: fixed;
      top: 54%;
      left: 50%;
      z-index: 4;
      pointer-events: auto;
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px;
      background: rgba(18,17,16,.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #f4efe8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      display: none;
      white-space: nowrap;
      box-shadow: 0 10px 34px rgba(0,0,0,.38);
      transform: translateX(-50%);
      transition: opacity .25s ease, transform .18s ease, background .2s;
    }
    .detail-entry-btn.show { display: block; }
    .detail-entry-btn:active {
      transform: translateX(-50%) scale(.92);
      background: rgba(255,255,255,.28);
    }
    #inlineVideo {
      position: fixed;
      z-index: 4;
      display: none;
      object-fit: cover;
      border-radius: 10px;
      background: #000;
      pointer-events: auto;
    }
    #inlineVideo.show { display: block; }
    .play-indicator {
      position: fixed;
      z-index: 5;
      display: none;
      pointer-events: none;
      width: 0;
      height: 0;
      border-left: 18px solid rgba(255,255,255,.88);
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.45));
      transform: translate(-50%, -50%);
    }
    .play-indicator.show { display: block; }
    #hud, #detail {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    #hud::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 190px;
      background: linear-gradient(180deg, rgba(2,2,2,.95), rgba(2,2,2,.58), transparent);
    }
    .brand {
      position: absolute;
      top: 48px;
      left: 22px;
      z-index: 1;
      width: min(260px, calc(100vw - 138px));
      transition: opacity .28s ease, transform .28s ease;
    }
    .brand small {
      display: block;
      color: rgba(244,239,232,.58);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
    }
    .brand h1 {
      margin: 6px 0 8px;
      color: #f3ece1;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(36px, 10.5vw, 54px);
      line-height: .9;
      letter-spacing: 0;
    }
    .brand p { display: none; }
    .fm-btn {
      position: absolute;
      top: 48px;
      right: 22px;
      z-index: 2;
      pointer-events: auto;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(244,239,232,.15);
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.45);
      transition: opacity .28s ease, transform .28s ease, background .2s;
    }
    .fm-btn:active {
      transform: scale(.88);
      background: rgba(255,255,255,.12);
    }
    .classify-btn {
      position: absolute;
      top: 48px;
      right: 68px;
      z-index: 2;
      pointer-events: auto;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(244,239,232,.15);
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.45);
      color: #f4efe8;
      font-size: 20px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      transition: opacity .28s ease, transform .28s ease, background .2s;
    }
    .classify-btn:active {
      transform: scale(.88);
      background: rgba(255,255,255,.12);
    }
    .fm-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: none;
      opacity: 0.92;
    }
    body.presenting .fm-btn, body.presenting .classify-btn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-12px);
    }
    .back-btn {
      pointer-events: auto;
      border: 0;
      border-radius: 999px;
      background: rgba(244,239,232,.94);
      color: #15110e;
      font: 800 13px Arial, "PingFang SC", sans-serif;
      min-height: 38px;
      padding: 0 18px;
    }
    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 32px;
      text-align: center;
      text-shadow: 0 2px 18px rgba(0,0,0,.8);
    }
    .caption strong {
      display: block;
      font-size: 24px;
      color: #f6efe4;
    }
    .caption span {
      display: block;
      margin-top: 7px;
      color: rgba(246,239,228,.58);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .caption {
      transition: opacity .36s ease, transform .36s ease;
    }
    body.presenting .caption {
      opacity: 0;
      transform: translateY(18px);
    }
    body.presenting .brand {
      opacity: 0;
      transform: translateY(-12px);
    }
    .album-title-layer {
      position: fixed;
      left: 0;
      right: 0;
      top: 18svh;
      z-index: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(22px) scale(.98);
      transition: opacity .46s ease, transform .46s ease;
      mix-blend-mode: screen;
    }
    body.presenting .album-title-layer {
      opacity: .28;
      transform: translateY(0) scale(1);
    }
    body.presenting #hud::before { opacity: 0; }
    .album-title-layer strong {
      max-width: 92vw;
      color: #fff7e8;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(58px, 21vw, 128px);
      line-height: .82;
      letter-spacing: 0;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 0 40px rgba(255,255,255,.28), 0 18px 58px rgba(0,0,0,.68);
    }
    .photo-drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      height: min(67svh, 620px);
      padding: 28px 18px calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(247,239,225,.96), rgba(218,208,190,.98));
      color: #17120e;
      border-radius: 26px 26px 0 0;
      box-shadow: none;
      transform: translateY(105%);
      transition: transform .58s cubic-bezier(.2,.86,.2,1);
      pointer-events: auto;
      overflow: hidden;
    }
    .photo-drawer.open { transform: translateY(0); }
    .drawer-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    .drawer-head strong {
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(32px, 10vw, 52px);
      line-height: .9;
      letter-spacing: 0;
    }
    .drawer-head span {
      flex: 0 0 auto;
      color: rgba(23,18,14,.56);
      font-size: 12px;
      font-weight: 900;
    }
    .drawer-grid {
      display: flex;
      flex-direction: row;
      gap: 12px;
      height: calc(100% - 64px);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 18px 8px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      scroll-padding: 0 calc(50vw - 90px);
    }
    .photo-thumb {
      flex: 0 0 auto;
      position: relative;
      border: 0;
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #1a1714 center / cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(23,18,14,.18);
      height: 100%;
      width: auto;
      scroll-snap-align: center;
    }
    .photo-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
    }
    .photo-thumb span {
      position: absolute;
      left: 9px;
      right: 9px;
      bottom: 8px;
      z-index: 1;
      color: #fff7ea;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.25;
      text-align: left;
      text-shadow: 0 1px 8px rgba(0,0,0,.65);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .photo-thumb.active {
      box-shadow: inset 0 0 0 3px #17120e, 0 12px 30px rgba(23,18,14,.22);
    }
    @media (orientation: landscape) {
      .album-title-layer, .photo-drawer { display: none; }
      #bgImage { display: none; }
      body {
        background:
          linear-gradient(rgba(0,0,0,.38), rgba(0,0,0,.56)),
          url('./images/1.png') center / cover no-repeat fixed,
          #020202;
      }
      #fmOverlay {
        background:
          linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
          url('./images/1.png') center / cover no-repeat,
          #020202;
      }
    }
    #detail {
      display: none;
      z-index: 5;
      background: #050505;
      pointer-events: auto;
    }
    #detail.open { display: block; }
    #detailCanvas {
      display: block;
      width: 100vw;
      height: 100svh;
    }
    .back-btn {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      background: rgba(0,0,0,.62);
      color: #fff7ea;
      border: 1px solid rgba(255,255,255,.18);
    }
    .error {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      padding: 28px;
      background: #080706;
      color: #f4efe8;
      text-align: center;
      font-weight: 800;
    }
    .error.show { display: grid; }

    /* ── B-SIDE FM Overlay ── */
    #fmOverlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url('./images/black-wallpaper.jpeg') center / cover no-repeat,
        #020202;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s ease;
      overflow: hidden;
    }
    #fmOverlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    #fmContainer {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .fm-close {
      position: absolute;
      top: 18px;
      right: 22px;
      z-index: 2;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(244,239,232,.15);
      border-radius: 50%;
      background: rgba(0,0,0,.5);
      color: #f4efe8;
      font-size: 22px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .fm-close:active {
      background: rgba(255,255,255,.12);
      border-color: rgba(244,239,232,.3);
    }
    .fm-hero {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: 30svh;
      padding: 50px 24px 16px;
    }
    .fm-hero-logo {
      width: min(88px, 24vw);
      height: auto;
      border-radius: 8px;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,.55));
    }
    .fm-hero-title {
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(23px, 6.4vw, 34px);
      color: #f3ece1;
      letter-spacing: 0.04em;
      margin: 10px 0 3px;
      text-align: center;
    }
    .fm-hero-sub {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: rgba(244,239,232,.38);
      text-transform: uppercase;
    }
    .fm-insight {
      flex-shrink: 0;
      max-height: 20svh;
      margin: 14px 24px 14px;
      padding: 0;
      background: transparent;
      border: none;
      overflow: hidden;
    }
    .fm-ai-dialog {
      display: flex;
      align-items: flex-start;
      padding: 10px 0 11px;
      border-top: 1px solid rgba(244,239,232,.18);
      border-bottom: 1px solid rgba(244,239,232,.1);
      background: rgba(3,4,5,.42);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
    }
    .fm-ai-copy {
      min-width: 0;
      flex: 1;
    }
    .fm-ai-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .14em;
      color: rgba(244,239,232,.82);
      text-transform: uppercase;
    }
    .fm-ai-status {
      flex: 0 0 auto;
      color: rgba(244,239,232,.36);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: none;
    }
    .fm-ai-message {
      margin: 0;
      min-height: 31px;
      color: rgba(244,239,232,.7);
      font-size: 11.5px;
      line-height: 1.38;
    }
    .fm-ai-message.typing::after {
      content: "";
      display: inline-block;
      width: 5px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -2px;
      background: rgba(244,239,232,.45);
      animation: fmCursor 0.85s steps(1) infinite;
    }
    @keyframes fmCursor {
      50% { opacity: 0; }
    }
    .fm-popup-mask {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      pointer-events: none;
      transition: background 0.3s ease, backdrop-filter 0.3s ease;
    }
    .fm-popup-mask.open {
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: auto;
    }
    .fm-popup {
      width: min(300px, 82vw);
      padding: 18px;
      border-radius: 18px;
      background: rgba(40,36,32,.72);
      border: 1px solid rgba(244,239,232,.1);
      box-shadow: 0 16px 48px rgba(0,0,0,.5);
      opacity: 0;
      transform: scale(0.92) translateY(10px);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .fm-popup-mask.open .fm-popup {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .fm-insight-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .fm-insight-ai {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: rgba(244,239,232,.62);
      text-transform: uppercase;
    }
    .fm-insight-conf {
      font-size: 10px;
      font-weight: 700;
      color: rgba(244,239,232,.35);
    }
    .fm-insight-text {
      font-size: 13px;
      line-height: 1.55;
      color: rgba(244,239,232,.78);
      margin: 0 0 6px;
    }
    .fm-insight-scene {
      font-size: 11px;
      font-weight: 700;
      color: rgba(244,239,232,.4);
      margin: 0;
    }
    .fm-cards {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 36px 14px;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .fm-card {
      border-radius: 12px;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(244,239,232,.055), rgba(244,239,232,.025));
      border: 1px solid rgba(244,239,232,.1);
      animation: fmCardIn 0.35s ease both;
      animation-delay: var(--delay, 0s);
    }
    @keyframes fmCardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fm-card--loading {
      height: 140px;
      position: relative;
      overflow: hidden;
      animation: none;
    }
    .fm-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(244,239,232,.04), transparent);
      animation: fmShimmer 1.2s ease infinite;
    }
    @keyframes fmShimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }
    .fm-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .fm-card-type {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: rgba(244,239,232,.72);
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(244,239,232,.075);
    }
    .fm-card-duration {
      font-size: 11px;
      font-weight: 700;
      color: rgba(244,239,232,.35);
      font-variant-numeric: tabular-nums;
    }
    .fm-card-title {
      font-size: 16px;
      font-weight: 800;
      color: #f4efe8;
      margin: 0;
      line-height: 1.3;
    }
    .fm-card-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .fm-card-info-btn {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(244,239,232,.24);
      background: rgba(244,239,232,.06);
      color: rgba(244,239,232,.68);
      font-size: 10px;
      font-weight: 900;
      font-style: italic;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .fm-card-info-btn:active {
      background: rgba(244,239,232,.14);
    }
    .fm-card-info-close {
      display: none;
    }
    .fm-card-reason {
      font-size: 13px;
      line-height: 1.5;
      color: rgba(244,239,232,.65);
      margin: 0 0 10px;
    }
    .fm-card-info {
      display: none;
    }
    .fm-card-memory {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.03);
      margin-bottom: 10px;
    }
    .fm-card-memory-label {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: rgba(244,239,232,.3);
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }
    .fm-card-memory-text {
      font-size: 12px;
      line-height: 1.5;
      color: rgba(244,239,232,.55);
      margin: 0;
      font-style: italic;
    }
    .fm-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .fm-card-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(244,239,232,.06);
      color: rgba(244,239,232,.45);
    }
    .fm-card-link {
      display: none;
    }
    .fm-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .fm-card-actions {
      display: flex;
      gap: 6px;
    }
    .fm-card-mv {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(244,239,232,.15);
      background: rgba(244,239,232,.06);
      color: rgba(244,239,232,.5);
      font-size: 10px;
      font-weight: 900;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .fm-card-mv:active {
      background: rgba(244,239,232,.15);
      color: rgba(244,239,232,.8);
    }
    .fm-card-play {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(244,239,232,.24);
      background: rgba(244,239,232,.08);
      color: rgba(244,239,232,.78);
      font-size: 13px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .fm-card-play:active {
      transform: scale(0.9);
      background: rgba(244,239,232,.18);
    }
    .fm-card-play.playing {
      background: rgba(244,239,232,.2);
      border-color: rgba(244,239,232,.42);
    }
    .fm-player {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(.2,.86,.2,1);
      padding: 0 16px calc(8px + env(safe-area-inset-bottom));
    }
    .fm-player.open {

  </style>

  <script>(function() {
  const canvas = document.getElementById("bgNoise");
  const ctx = canvas.getContext("2d");
  let frame = 0, w = 0, h = 0;
  let startTime = 0;

  function resize() {
    w = Math.max(320, innerWidth);
    h = Math.max(320, innerHeight);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
  }

  function draw() {
    frame++;
    if (frame % 3 === 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const elapsed = startTime ? performance.now() - startTime : 0;
      const waveOffset = Math.sin(elapsed / 6000 * Math.PI * 2) * canvas.height * 0.08;
      const glowCY = canvas.height * 0.24 + waveOffset;

      ctx.save();
      ctx.translate(canvas.width / 2, glowCY);
      ctx.scale(1.9, 0.42);
      const r = canvas.width * 0.46;
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      glow.addColorStop(0, "rgba(42, 37, 32, 0.45)");
      glow.addColorStop(0.32, "rgba(42, 37, 32, 0.14)");
      glow.addColorStop(0.68, "rgba(42, 37, 32, 0.03)");
      glow.addColorStop(1, "rgba(2, 2, 2, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(-canvas.width, -canvas.height * 3, canvas.width * 2, canvas.height * 6);
      ctx.restore();

      const vig = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, canvas.width * 0.28,
        canvas.width / 2, canvas.height / 2, canvas.width * 0.84
      );
      vig.addColorStop(0, "rgba(0, 0, 0, 0)");
      vig.addColorStop(1, "rgba(0, 0, 0, 0.94)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    requestAnimationFrame(draw);
  }

  addEventListener("resize", resize);
  resize();
  startTime = performance.now();
  draw();
})();</script>
  <script>(function() {
    var API = "http://localhost:5050/api/classify";
    var input = document.getElementById("classifyInput");
    var toast = document.getElementById("classifyToast");
    var toastText = document.getElementById("classifyToastText");
    var videoExts = {".mp4":1,".mov":1,".avi":1,".mkv":1,".webm":1};

    function showLocalToast(text) {
      toastText.textContent = text;
      toast.style.opacity = "1";
      toast.style.transform = "translate(-50%,-50%) scale(1)";
      clearTimeout(toast._t);
      toast._t = setTimeout(function() {
        toast.style.opacity = "0";
        toast.style.transform = "translate(-50%,-50%) scale(0.9)";
      }, 2200);
    }

    document.getElementById("classifyBtn").addEventListener("click", function() {
      input.value = "";
      input.click();
    });

    input.addEventListener("change", function() {
      if (!input.files.length) return;
      var file = input.files[0];
      var ext = file.name.substring(file.name.lastIndexOf(".")).toLowerCase();
      var isVideo = !!videoExts[ext];

      showLocalToast("正在识别中…");

      var form = new FormData();
      form.append("file", file);

      fetch(API, { method: "POST", body: form })
        .then(function(res) {
          if (!res.ok) throw new Error("识别失败 (" + res.status + ")");
          return res.json();
        })
        .then(function(data) {
          window.dispatchEvent(new CustomEvent("bside:classify-add", {
            detail: {
              genre: data.genre,
              fileName: file.name,
              fileUrl: URL.createObjectURL(file),
              isVideo: isVideo
            }
          }));
        })
        .catch(function(err) {
          showLocalToast(err.message);
        });
    });
  })();</script>
